<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="15" ry="15" />
  <text x="50%" y="40%" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Awesome Referral Marketing
  </text>
  <text x="50%" y="65%" font-family="Arial, sans-serif" font-size="20" fill="#f0f0f0" text-anchor="middle">
    Curated List of SaaS Products &amp; Open-Source Projects
  </text>
  <circle cx="100" cy="100" r="10" fill="#ffffff" opacity="0.5">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="10" fill="#ffffff" opacity="0.5">
    <animate attributeName="r" values="10;20;10" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>
</svg>
