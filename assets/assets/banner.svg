<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 40px sans-serif; fill: white; text-anchor: middle; }
      .subtitle { font: 20px sans-serif; fill: white; text-anchor: middle; }
      .floating { animation: float 3s ease-in-out infinite; }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" />
  <g class="floating">
    <text x="400" y="90" class="title">Awesome Referral Marketing</text>
    <text x="400" y="130" class="subtitle">The Ultimate Growth Stack Ecosystem</text>
  </g>
</svg>
